name: Update CFB schedule data

on:
  schedule:
    # Runs at 13:00 UTC (7am Mountain) every day.
    # Games/TV windows/odds get added or change all week, so a daily
    # refresh keeps things current without hammering ESPN's API.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: python scripts/update_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "cfb-planner-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "No changes to data.json"
          else
            git add data.json
            git commit -m "Auto-update schedule data"
            git push
          fi
